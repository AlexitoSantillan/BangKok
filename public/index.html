<style>
:root{--ink:#0e1b2c;--paper:#eef2f7;--card:#fff;--line:#d6dde7;--muted:#5a6b80;--robot:#2b6cff;--human:#0f9d8a;--warn:#e8a317;box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--ink);color:#fff}
header h1{font-size:20px;margin:0;font-weight:800}
header p{margin:2px 0 0;font-size:13px;color:#9fb2c8}
select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #3a4d66;background:#14283f;color:#fff}
main{display:grid;grid-template-columns:340px minmax(0,1fr) 340px;gap:14px;padding:14px 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:15px;margin:0 0 10px;font-weight:800}
textarea{width:100%;min-height:78px;resize:vertical;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px}
textarea:focus,button:focus-visible,select:focus-visible{outline:3px solid #7fb0ff;outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.primary{background:var(--robot);color:#fff;width:100%;margin-top:8px}
.primary:disabled{opacity:.6;cursor:wait}
.ghost{background:#e6ecf5;color:var(--ink);margin-top:8px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:#f1f4f9;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:400;color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
#stage{position:relative;min-height:460px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#16394a 0%,#0a161c 75%);border:1px solid var(--line)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#stageHint{position:absolute;left:12px;top:10px;color:#9fb2c8;font-size:12px;pointer-events:none}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{border:1px solid var(--line);border-radius:10px;padding:8px}
.m b{display:block;font-size:22px}
.m span{font-size:11px;color:var(--muted)}
.bar{height:8px;background:#e6ecf5;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--human);transition:width .4s,background .4s}
#log{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
#log li{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
#log li:first-child{border-top:0}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;color:#fff;margin-right:6px}
.badge.robot{background:var(--robot)}.badge.analyst{background:var(--human)}
.src{font-size:11px;color:var(--muted);margin-left:4px}
.why{color:var(--muted);margin-top:2px}
.col{display:flex;flex-direction:column;gap:14px}
@media(max-width:1000px){main{grid-template-columns:1fr}#stage{order:-1;min-height:360px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<header>

</main>

function step(dt,time){
  stripes.forEach(function(s){s.position.x+=dt*1.2;if(s.position.x>1)s.position.x=-7;});

  }

  hBody.material.color.copy(new THREE.Color(0x2de2c0).lerp(new THREE.Color(0xe53935),hLoad));
  hAL.rotation.x=-0.9+Math.sin(time*9)*0.15;hAR.rotation.x=-0.9+Math.cos(time*9)*0.15;
  screen.material.emissiveIntensity=0.6+0.4*Math.sin(time*3);ring.material.opacity=0.45+0.2*Math.sin(time*2);
}
var drag=false,lx=0;
renderer.domElement.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;});
window.addEventListener('pointerup',function(){drag=false;});
window.addEventListener('pointermove',function(e){if(drag){ang-=(e.clientX-lx)*0.008;lx=e.clientX;}});
var last=performance.now(),t0=last;
function loop(now){var dt=Math.min((now-last)/1000,0.05);last=now;if(!drag)ang+=dt*0.08;
  camera.position.set(Math.sin(ang)*rad,elev,Math.cos(ang)*rad);camera.lookAt(2,1.2,0);step(dt,(now-t0)/1000);renderer.render(scene,camera);requestAnimationFrame(loop);}
resize();setText();metrics();requestAnimationFrame(loop);
})();
</script>
</body>
